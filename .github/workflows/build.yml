name: Build downloads

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDCPP_REF: master

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch stable-diffusion.cpp
        shell: bash
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp && git checkout "$SDCPP_REF" && git submodule update --init --recursive

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd sdcpp
          mkdir -p ../out
          for v in avx2 avx; do
            if [ "$v" = "avx2" ]; then
              F="-DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
            else
              F="-DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
            fi
            cmake -B "build-$v" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX=ON $F -DSD_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
            cmake --build "build-$v" --config Release --target sd-cli -j 4
            
            BIN="build-$v/bin/sd-cli"
            if [ ! -f "$BIN" ]; then BIN="build-$v/bin/sd"; fi
            cp "$BIN" "../out/sd-cli-$v"
            chmod +x "../out/sd-cli-$v"
          done
          ../out/sd-cli-avx2 --help | head -5

      - name: Build (Windows 7 compatible)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cd sdcpp
          mkdir -p ../out
          for v in avx2 avx; do
            if [ "$v" = "avx2" ]; then
              F="-DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
            else
              F="-DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
            fi
            cmake -B "build-$v" -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
              -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0601 -DWINVER=0x0601" \
              -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0601 -DWINVER=0x0601 /EHsc" \
              -DGGML_NATIVE=OFF -DGGML_AVX=ON $F -DSD_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
            cmake --build "build-$v" --config Release --target sd-cli -j 4
            
            BIN="build-$v/bin/Release/sd-cli.exe"
            if [ ! -f "$BIN" ]; then BIN="build-$v/bin/Release/sd.exe"; fi
            cp "$BIN" "../out/sd-cli-$v.exe"
          done
          ../out/sd-cli-avx2.exe --help | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  package:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            args: --linux AppImage --x64
            artifact: app-linux
            glob: dist/*.AppImage
          - os: windows-2022
            name: windows
            args: --win portable --x64
            artifact: app-windows
            glob: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: bin

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.1.${GITHUB_RUN_NUMBER}"; fi
          npm pkg set version="$VERSION"
          chmod +x bin/* || true
          ls -la bin

      - run: npm install --no-audit --no-fund

      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: downloads
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          generate_release_notes: true
